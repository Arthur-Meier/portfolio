name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Test
        run: node --test
      - name: Generate portfolio
        env:
          PAGE_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/generate.mjs --origin "$PAGE_ORIGIN" --base-path "$PAGE_BASE_PATH"
      - name: Validate generated pages
        env:
          PAGE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/check-site.py dist --base-path "$PAGE_BASE_PATH"
      - name: Upload generated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
